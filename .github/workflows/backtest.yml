name: Historical backtest
on:
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: jolpica-2019-2024-v1
      - run: python -m ml.ingestion.jolpica --seasons 2019 2020 2021 2022 2023 2024
      - run: python -m ml.features.build
      - run: python -m ml.training.train
      - uses: actions/upload-artifact@v4
        with:
          name: model-report
          path: |
            ml/artifacts/*/report.json
            data/processed/coverage.*
