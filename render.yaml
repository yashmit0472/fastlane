services:
  - type: web
    name: fastlane-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerCommand: /bin/bash /app/scripts/render-service.sh
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
